<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دفتر المذاكرة والـ PDF</title>
  <link rel="stylesheet" href="style.css">
  <!-- مكتبة عرض الـ PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
</head>
<body>

  <!-- شريط الأدوات العلوي -->
  <div class="toolbar">
    <input type="file" id="file-input" accept="application/pdf">
    <button id="prev-page">الصفحة السابقة</button>
    <span>صفحة: <span id="page-num">1</span> / <span id="page-count">0</span></span>
    <button id="next-page">الصفحة التالية</button>

    <div class="tools">
      <label>اللون: <input type="color" id="color-picker" value="#000000"></label>
      <label>حجم القلم: <input type="range" id="brush-size" min="1" max="20" value="3"></label>
      <button id="clear-canvas">مسح الشخبطة</button>
    </div>
  </div>

  <!-- مكان عرض الـ PDF والرسم -->
  <div class="main-container">
    <div class="pdf-wrapper">
      <canvas id="pdf-render"></canvas>
      <canvas id="draw-canvas"></canvas>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
